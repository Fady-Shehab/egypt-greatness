<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الصفحة غير موجودة — عظمة وجلال مصر</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%230A0A0A'/%3E%3Ctext y='.85em' font-size='80' text-anchor='middle' x='50'%3E%E2%98%A5%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0A0A0A;color:#F5F5F0;font-family:'Cairo',sans-serif;min-height:100dvh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;overflow:hidden}
.wrap{max-width:480px;width:100%}
.glyph{font-size:5rem;color:#D4AF37;opacity:.3;margin-bottom:24px;animation:pulse 3s ease-in-out infinite}
.code{font-size:clamp(5rem,20vw,8rem);font-weight:900;color:#D4AF37;line-height:1;margin-bottom:8px;text-shadow:0 0 60px rgba(212,175,55,.2)}
.title{font-size:clamp(1.2rem,4vw,1.6rem);font-weight:700;margin-bottom:16px;color:#F5F5F0}
.sub{font-size:.95rem;color:#A1A1AA;line-height:1.7;margin-bottom:40px}
.btn{display:inline-flex;align-items:center;gap:10px;padding:14px 36px;border:1px solid #D4AF37;color:#D4AF37;font-family:'Cairo',sans-serif;font-size:1rem;font-weight:700;border-radius:2px;text-decoration:none;position:relative;overflow:hidden;transition:color .3s ease}
.btn::before{content:'';position:absolute;inset:0;background:#D4AF37;transform:scaleX(0);transform-origin:right;transition:transform .4s ease;z-index:-1}
.btn:hover{color:#0A0A0A}
.btn:hover::before{transform:scaleX(1);transform-origin:left}
.line{width:1px;height:60px;background:linear-gradient(to bottom,#D4AF37,transparent);margin:40px auto 0;opacity:.3}
@keyframes pulse{0%,100%{opacity:.2;transform:scale(1)}50%{opacity:.4;transform:scale(1.05)}}
</style>
</head>
<body>
<div class="wrap">
  <div class="glyph">☥</div>
  <div class="code">404</div>
  <h1 class="title">هذه الصفحة غير موجودة</h1>
  <p class="sub">يبدو أنك ضللت الطريق وسط آلاف السنين من الحضارة.<br>دعنا نعيدك إلى البداية.</p>
  <a href="index.html" class="btn">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    العودة للرئيسية
  </a>
  <div class="line"></div>
</div>
</body>
</html>
